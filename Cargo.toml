[workspace]
members = [
    "crates/escpos2png",
    "crates/escpos2png-profiles",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
