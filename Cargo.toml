[workspace]
members = [
    "crates/escpost",
    "crates/escpost-python",
    "crates/escpost-profiles",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
encoding_rs = "0.8.35"
fontdue = "0.9.3"
oem_cp = "2.1.2"
png = "0.18"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
