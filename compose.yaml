x-development-service: &development-service
  image: escpost-development
  network_mode: host
  build:
    context: .
    args:
      USER_ID: 1000
      GROUP_ID: 1000
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cargo-home:/home/developer/.cargo
    - cargo-target:/home/developer/target
    - python-venv:/workspace/.venv

services:
  test:
    <<: *development-service

  cli:
    <<: *development-service
    environment:
      # Keep configuration used by this checkout separate from any
      # host-installed ESCPost version.
      ESCPOST_CONFIG_DIR: /home/developer/.config/escpost
      # Let the containerized binary report the host directory that backs the
      # mount above instead of its container-only path.
      ESCPOST_CONFIG_DISPLAY_DIR: ${ESCPOST_CONFIG_DISPLAY_DIR:-}
    volumes:
      - .:/workspace
      - ${ESCPOST_CONFIG_HOST_DIR:-./local/config}:/home/developer/.config/escpost
      - cargo-home:/home/developer/.cargo
      - cargo-target:/home/developer/target
      - python-venv:/workspace/.venv
    devices:
      - /dev/bus/usb:/dev/bus/usb
    group_add:
      - "${USB_GROUP_ID:-7}"
    entrypoint:
      - /workspace/scripts/cli-entrypoint

volumes:
  cargo-home:
  cargo-target:
  python-venv:
