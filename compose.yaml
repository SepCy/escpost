x-development-service: &development-service
  image: escpos2png-development
  network_mode: host
  build:
    context: .
    args:
      USER_ID: 1000
      GROUP_ID: 1000
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cargo-home:/home/developer/.cargo
    - cargo-target:/home/developer/target
    - python-venv:/workspace/.venv

services:
  test:
    <<: *development-service

  cli:
    <<: *development-service
    devices:
      - /dev/bus/usb:/dev/bus/usb
    group_add:
      - "${USB_GROUP_ID:-7}"
    entrypoint:
      - /workspace/scripts/cli-entrypoint

  preview:
    <<: *development-service
    network_mode: bridge
    command:
      - python3
      - -m
      - http.server
      - "8765"
      - --bind
      - 0.0.0.0
      - --directory
      - /workspace
    ports:
      - "8765:8765"

volumes:
  cargo-home:
  cargo-target:
  python-venv:
