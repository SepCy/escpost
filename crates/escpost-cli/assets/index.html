<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESCPost render</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 24px 0;
        background: #171717;
        color: #f5f5f5;
      }

      header {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
        padding: 0 24px;
      }

      /* Title on the left, server status centred on the first line. */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
      }

      .bar h1 {
        justify-self: start;
      }

      #serverStatus {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #b8b8b8;
        font-size: 13px;
      }

      /* The profile is what we render as; it sits in the server headline
         between the address and the connection state. */
      #profile:empty {
        display: none;
      }

      #profile:not(:empty)::before,
      #connectionState::before {
        content: "·";
        margin-right: 8px;
        color: #6b6b6b;
      }

      /* Print-status header inside the sheets box: everything about the latest
         print (completion time, idle-timeout, receiving). Its first field
         varies, so it is spaced with a gap rather than leading separators. */
      #printStatus {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        color: #b8b8b8;
        font-size: 13px;
      }

      /* The job status: "Waiting for first job" or the completion time. */
      #jobStatus:empty {
        display: none;
      }

      /* A caution shown when a job was completed by the idle timeout rather
         than an explicit connection close, so it may be incomplete. */
      #completion:empty {
        display: none;
      }

      #completion {
        color: #ffb454;
      }

      /* Download the current job's exact captured bytes. JS controls display. */
      #download {
        display: none;
        color: #7fd1ff;
        text-decoration: none;
      }

      #download:hover {
        text-decoration: underline;
      }

      /* While a job is still arriving, this replaces the job status and
         completion and pulses to signal ongoing activity. The last render and
         the profile stay visible. */
      #receiving {
        display: none;
        align-items: center;
        color: #7fd1ff;
        animation: receiving-pulse 1.2s ease-in-out infinite;
      }

      #printStatus.receiving #jobStatus,
      #printStatus.receiving #completion {
        display: none;
      }

      #printStatus.receiving #receiving {
        display: inline-flex;
      }

      @keyframes receiving-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      #connection {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #connection::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b6b6b;
      }

      #connection.connected::before {
        background: #57c964;
      }

      #connection.offline::before {
        background: #ff6b6b;
      }

      #connection.error::before {
        background: #ffb454;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      label,
      #status,
      .sheet-dimensions {
        color: #b8b8b8;
        font-size: 13px;
      }

      /* Keep view controls inside the fixed footer panel. */
      #viewOptions {
        display: flex;
        align-self: center;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        justify-self: end;
      }

      #viewOptions label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      #viewOptions input {
        margin: 0;
      }

      select {
        padding: 4px 8px;
        font: inherit;
      }

      #viewport {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      #previewPanel {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        padding: 24px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #252525;
      }

      #sheets {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        /* Centre each row and wrap to the next line when a row runs out of
           horizontal space. "safe" falls back to start-alignment when a sheet
           is wider than the viewport (e.g. at high zoom) so its left edge stays
           scrollable rather than being clipped. */
        justify-content: safe center;
        gap: 24px;
      }

      #traceWorkspace {
        display: grid;
        flex: 1 1 auto;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        min-height: 0;
        overflow: auto;
        gap: 24px;
        align-items: start;
      }

      #traceWorkspace.trace-without-commands #sheets {
        grid-column: 1 / -1;
      }

      #commandPanel {
        position: sticky;
        top: 0;
        max-height: calc(100vh - 150px);
        overflow: auto;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #1d1d1d;
      }

      #commandPanel[hidden] {
        display: none;
      }

      #commandPanel h2 {
        margin: 0;
        padding: 14px 16px 10px;
        font-size: 14px;
      }

      #commandPanel p {
        margin: 0;
        padding: 0 16px 12px;
        color: #8f8f8f;
        font-size: 11px;
      }

      #commandList {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin: 0;
        padding: 0;
        list-style: none;
        background: #333;
      }

      .trace-command {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        color: inherit;
        background: #252525;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .trace-command:hover,
      .trace-command:focus-visible,
      .trace-command.trace-previewed {
        outline: none;
        background: #3a2929;
        box-shadow: inset 3px 0 #ff8a8a;
      }

      .trace-command.trace-pinned {
        background: #3b2323;
        box-shadow: inset 3px 0 #d94b4b;
      }

      .trace-command-name {
        color: #ffcf8a;
        font-weight: 700;
      }

      .trace-command-range {
        justify-self: end;
        color: #858585;
        font-size: 11px;
        text-align: right;
      }

      .trace-command-detail,
      .trace-command-effects {
        grid-column: 2;
      }

      .trace-command-detail {
        color: #f5f5f5;
        overflow-wrap: anywhere;
      }

      .trace-command-effects {
        color: #a7a7a7;
        font-size: 11px;
      }

      .trace-command-annotation {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 0 12px 10px 34px;
        background: #252525;
        overflow-wrap: anywhere;
      }

      .trace-command:hover + .trace-command-annotation,
      .trace-command:focus-visible + .trace-command-annotation,
      .trace-command.trace-previewed + .trace-command-annotation {
        background: #3a2929;
      }

      .trace-command.trace-pinned + .trace-command-annotation {
        background: #3b2323;
      }

      .trace-command-annotation a {
        min-width: 0;
        color: #ff8a8a;
      }

      .trace-command-annotation > span {
        min-width: 0;
        color: #d0d0d0;
      }

      .trace-command-copy {
        flex: 0 0 auto;
        padding: 2px 5px;
        border: 1px solid #555;
        border-radius: 3px;
        color: #f5f5f5;
        background: #303030;
        cursor: pointer;
      }

      .sheet {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
      }

      .sheet figcaption {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sheet-name {
        color: #f5f5f5;
        font-size: 13px;
        font-weight: 700;
      }

      .receipt {
        display: block;
        max-width: none;
        /* Reserve blank paper on top/left/right at all times so toggling the
           margin only changes its colour and shadow and never shifts the
           receipt. The bottom is left flush because receipt paper feeds
           continuously. */
        padding: 16px 16px 0;
        background-color: transparent;
        /* Faithful 1-bit dots stay crisp under nearest-neighbour scaling. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transition:
          background-color 150ms ease,
          box-shadow 150ms ease;
      }

      .receipt-layer {
        position: relative;
      }

      .trace-overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        overflow: visible;
        shape-rendering: crispEdges;
      }

      .trace-region {
        fill: transparent;
        stroke: transparent;
        stroke-width: 1px;
        pointer-events: all;
        cursor: pointer;
      }

      .trace-region-group {
        --trace-color: #ff8a8a;
        --trace-fill: rgb(255 138 138 / 32%);
      }

      .trace-region-group.trace-pinned {
        --trace-color: #d94b4b;
        --trace-fill: rgb(217 75 75 / 32%);
      }

      .trace-region-group:hover .trace-region,
      .trace-region-group:focus-visible .trace-region,
      .trace-region-group.trace-previewed .trace-region,
      .trace-region-group.trace-pinned .trace-region {
        fill: var(--trace-fill);
        stroke: var(--trace-color);
      }

      .trace-motion-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 12px;
        pointer-events: stroke;
        cursor: pointer;
      }

      .trace-motion-visual,
      .trace-motion-label,
      .trace-paint-label {
        opacity: 0;
        pointer-events: none;
      }

      .trace-motion-visual {
        fill: none;
        stroke: var(--trace-color);
        stroke-width: 2px;
        stroke-dasharray: 6 4;
      }

      .trace-motion-label rect,
      .trace-paint-label rect {
        fill: #252525;
        stroke: var(--trace-color);
        stroke-width: 1px;
      }

      .trace-motion-label text,
      .trace-paint-label text {
        fill: var(--trace-color);
        font: 700 10px/1 monospace;
        text-anchor: middle;
      }

      .trace-paint-label .trace-paint-action {
        font-size: 12px;
      }

      .trace-region-group:hover .trace-motion-visual,
      .trace-region-group:focus-visible .trace-motion-visual,
      .trace-region-group.trace-previewed .trace-motion-visual,
      .trace-region-group.trace-pinned .trace-motion-visual,
      .trace-region-group:hover .trace-motion-label,
      .trace-region-group:focus-visible .trace-motion-label,
      .trace-region-group.trace-previewed .trace-motion-label,
      .trace-region-group.trace-pinned .trace-motion-label,
      .trace-region-group:hover .trace-paint-label,
      .trace-region-group:focus-visible .trace-paint-label,
      .trace-region-group.trace-previewed .trace-paint-label,
      .trace-region-group.trace-pinned .trace-paint-label {
        opacity: 1;
        pointer-events: all;
        cursor: pointer;
      }

      /* An anti-aliased preview is a supersampled grayscale image, so let the
         browser smooth it: nearest-neighbour would discard the very softening
         it encodes whenever the image is scaled into its box. */
      #sheets.antialiased .receipt {
        image-rendering: auto;
      }

      /* The reserved padding reads as unprinted receipt paper when enabled, and
         the sheet gains a drop shadow so it looks like a physical sheet. With
         the margin off there is no paper frame, so no shadow either. */
      #sheets.paper-margin .receipt {
        background-color: white;
        box-shadow: 0 3px 16px rgb(0 0 0 / 45%);
      }

      /* Briefly tint the margin on enable so its extent is visible. */
      @keyframes reveal-margin {
        from {
          background-color: #7fd1ff;
        }
        to {
          background-color: white;
        }
      }

      #sheets.paper-margin.flash .receipt {
        animation: reveal-margin 600ms ease-out;
      }

      #waiting {
        display: none;
        margin: 0;
        color: #b8b8b8;
      }

      #error {
        display: none;
        color: #ff9d9d;
      }

      /* Non-fatal render diagnostics (e.g. a cut dropped on a cutter-less
         profile). Amber to set them apart from the red render-error banner. */
      #warnings {
        display: none;
        max-height: min(25vh, 180px);
        margin: 0 0 8px;
        overflow-y: auto;
        scrollbar-gutter: stable;
        color: #ffb454;
        font-size: 13px;
      }

      #warnings .warning {
        display: flex;
        gap: 6px;
      }

      #warnings .warning::before {
        content: "⚠";
      }

      /* Footer note under the sheets; only meaningful once something is
         rendered, so it is hidden while the sheet list is empty. */
      #magnifyHint {
        margin: 0;
        color: #6b6b6b;
        font-size: 13px;
      }

      #viewport:has(#sheets:empty) #magnifyHint {
        display: none;
      }

      #footerPanel {
        display: grid;
        flex: 0 0 auto;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        padding: 12px 24px;
      }

      #footerMessages {
        min-width: 0;
      }

      #error {
        margin: 0;
      }

      @media (max-width: 800px) {
        body {
          padding: 12px 0;
        }

        header {
          padding: 0 12px;
        }

        #viewport {
          gap: 0;
        }

        #previewPanel {
          padding: 16px;
        }

        #traceWorkspace {
          grid-template-columns: minmax(0, 1fr);
        }

        #sheets {
          order: 1;
        }

        #commandPanel {
          position: static;
          order: 2;
          max-height: 45vh;
        }

        #footerPanel {
          grid-template-columns: minmax(0, 1fr);
          padding: 10px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>ESCPost render</h1>
        <div id="serverStatus">
          <span id="connection">
            <span id="serverAddress"></span>
            <span id="profile"></span>
            <span id="connectionState">Connecting…</span>
          </span>
        </div>
      </div>
    </header>

    <main id="viewport">
      <div id="previewPanel">
        <div id="printStatus">
          <span id="jobStatus"></span>
          <span id="completion"></span>
          <a id="download" href="/job" download>Download raw input</a>
          <span id="receiving">Receiving a job…</span>
        </div>
        <div id="traceWorkspace">
          <aside id="commandPanel" aria-label="Experimental command trace" hidden>
            <h2>Commands <small>experimental</small></h2>
            <p>Hover or focus to preview. Click to pin a command.</p>
            <ol id="commandList"></ol>
          </aside>
          <div id="sheets" aria-live="polite"></div>
        </div>
      </div>
      <div id="footerPanel">
        <div id="footerMessages">
          <div id="warnings" aria-live="polite"></div>
          <p id="waiting" aria-live="polite"></p>
          <p id="error"></p>
        </div>
        <div id="viewOptions">
          <p id="magnifyHint">Use your browser's zoom to magnify.</p>
          <label>
            <input type="checkbox" id="margin">
            Paper margin
          </label>
        </div>
      </div>
    </main>

    <script>
      const sheets = document.querySelector("#sheets");
      const traceWorkspace = document.querySelector("#traceWorkspace");
      const commandPanel = document.querySelector("#commandPanel");
      const commandList = document.querySelector("#commandList");
      const waiting = document.querySelector("#waiting");
      const error = document.querySelector("#error");
      const warnings = document.querySelector("#warnings");
      const margin = document.querySelector("#margin");
      const profile = document.querySelector("#profile");
      const jobStatus = document.querySelector("#jobStatus");
      const completionLabel = document.querySelector("#completion");
      const download = document.querySelector("#download");
      const connection = document.querySelector("#connection");
      const connectionState = document.querySelector("#connectionState");
      const printStatus = document.querySelector("#printStatus");

      function completionTime(millis) {
        return typeof millis === "number"
          ? new Date(millis).toLocaleTimeString()
          : "";
      }

      // The address the viewer is talking to never changes for this page.
      document.querySelector("#serverAddress").textContent = window.location.host;
      let currentRendering = "";
      let pinnedCommand = null;
      let previewedCommand = null;

      function updateCommandHighlights() {
        document.querySelectorAll("[data-command-index]").forEach((element) => {
          const commandIndex = Number(element.dataset.commandIndex);
          element.classList.toggle("trace-previewed", commandIndex === previewedCommand);
          element.classList.toggle("trace-pinned", commandIndex === pinnedCommand);
          if (element.classList.contains("trace-command")) {
            element.setAttribute(
              "aria-pressed",
              String(commandIndex === pinnedCommand)
            );
          }
        });
      }

      function scrollWithin(element, container, includeHorizontal = false) {
        const elementBounds = element.getBoundingClientRect();
        const containerBounds = container.getBoundingClientRect();
        const visibleBottom = containerBounds.top + container.clientHeight;
        const visibleRight = containerBounds.left + container.clientWidth;
        let top = 0;
        let left = 0;
        if (elementBounds.top < containerBounds.top) {
          top = elementBounds.top - containerBounds.top;
        } else if (elementBounds.bottom > visibleBottom) {
          top = elementBounds.bottom - visibleBottom;
        }
        if (includeHorizontal && elementBounds.left < containerBounds.left) {
          left = elementBounds.left - containerBounds.left;
        } else if (includeHorizontal && elementBounds.right > visibleRight) {
          left = elementBounds.right - visibleRight;
        }
        container.scrollBy({ top, left });
      }

      function revealCommand(index) {
        const command = commandList.querySelector(`[data-command-index="${index}"]`);
        if (command) {
          scrollWithin(command, commandPanel);
        }
      }

      function revealPreview(index) {
        const region = sheets.querySelector(
          `.trace-region-group[data-command-index="${index}"]`
        );
        if (region) {
          scrollWithin(region, traceWorkspace, true);
        }
      }

      function previewCommand(index, revealListItem = false, revealPreviewItem = false) {
        previewedCommand = index;
        updateCommandHighlights();
        if (revealListItem && index !== null) {
          revealCommand(index);
        }
        if (revealPreviewItem && index !== null) {
          revealPreview(index);
        }
      }

      function togglePinnedCommand(index) {
        pinnedCommand = pinnedCommand === index ? null : index;
        updateCommandHighlights();
      }

      sheets.addEventListener("click", (event) => {
        if (
          event.target.closest(".receipt-layer") &&
          !event.target.closest(".trace-region-group")
        ) {
          pinnedCommand = null;
          updateCommandHighlights();
        }
      });

      function activateCommand(index, revealListItem, revealPreviewItem = false) {
        togglePinnedCommand(index);
        if (revealListItem) {
          revealCommand(index);
        }
        if (revealPreviewItem) {
          revealPreview(index);
        }
      }

      function bindCommandInteraction(
        element,
        index,
        revealListItem = false,
        revealPreviewItem = false
      ) {
        element.dataset.commandIndex = String(index);
        element.addEventListener("mouseenter", () => previewCommand(index));
        element.addEventListener("pointermove", () => {
          if (revealListItem) {
            revealCommand(index);
          }
          if (revealPreviewItem) {
            revealPreview(index);
          }
        });
        element.addEventListener("mouseleave", () => previewCommand(null));
        element.addEventListener(
          "focus",
          () => previewCommand(index, revealListItem, revealPreviewItem)
        );
        element.addEventListener("blur", () => previewCommand(null));
        element.addEventListener(
          "click",
          () => activateCommand(index, revealListItem, revealPreviewItem)
        );
      }

      function effectSummary(effect) {
        if (effect.type === "state_change") {
          return `${effect.state}: ${effect.before} → ${effect.after}`;
        }
        if (effect.type === "motion") {
          return `position: (${effect.before.x}, ${effect.before.y}) → ` +
            `(${effect.after.x}, ${effect.after.y})`;
        }
        if (effect.type === "paint") {
          return `paint bounds: ${effect.bounds.width} × ${effect.bounds.height}`;
        }
        return effect.type;
      }

      function groupAdjacentCommands(commands, firstGroupIndex) {
        const groups = [];
        (commands || []).forEach((command) => {
          const previousGroup = groups.at(-1);
          const previousCommand = previousGroup?.commands.at(-1);
          const joinsTextGroup =
            command.name === "Text" &&
            previousCommand?.name === "Text" &&
            previousCommand.byte_end === command.byte_start;
          const joinsLineFeedGroup =
            command.name === "LF" &&
            previousCommand?.name === "LF" &&
            previousCommand.byte_end === command.byte_start;
          if (joinsTextGroup || joinsLineFeedGroup) {
            previousGroup.commands.push(command);
          } else {
            groups.push({
              index: firstGroupIndex + groups.length,
              commands: [command],
            });
          }
        });
        return groups;
      }

      function commandGroupView(group) {
        const first = group.commands[0];
        const last = group.commands.at(-1);
        const textGroup = first.name === "Text";
        const lineFeedGroup = first.name === "LF" && group.commands.length > 1;
        return {
          name: first.name,
          byte_start: first.byte_start,
          byte_end: last.byte_end,
          detail: textGroup
            ? group.commands.map((command) => command.detail).join("")
            : lineFeedGroup
              ? `${group.commands.length}x ${first.detail}`
              : first.detail,
          annotation: first.annotation,
          effects: group.commands.flatMap((command) => command.effects),
          command_count: group.commands.length,
        };
      }

      function motionTerminals(commandGroups, motionGroupIndex, motion) {
        const destinationLength = 8;
        for (let index = motionGroupIndex - 1; index >= 0; index -= 1) {
          const matchingPaint = commandGroups[index].commands
            .flatMap((command) => command.effects)
            .filter((effect) =>
              effect.type === "paint" &&
              effect.bounds.y <= motion.before.y &&
              effect.bounds.y + effect.bounds.height > motion.before.y
            );
          if (matchingPaint.length > 0) {
            const sourceTop = Math.min(...matchingPaint.map((effect) => effect.bounds.y));
            const sourceBottom = Math.max(...matchingPaint.map((effect) =>
              effect.bounds.y + effect.bounds.height
            ));
            return {
              sourceX: Math.max(...matchingPaint.map((effect) =>
                effect.bounds.x + effect.bounds.width
              )),
              sourceTop,
              sourceBottom,
              targetBottom: motion.after.y + destinationLength,
            };
          }
        }
        return {
          sourceX: motion.before.x,
          sourceTop: motion.before.y,
          sourceBottom: motion.before.y,
          targetBottom: motion.after.y + destinationLength,
        };
      }

      function groupEffectSummary(command) {
        if (command.name === "Text" && command.command_count > 1) {
          const paintCount = command.effects.filter((effect) => effect.type === "paint").length;
          return `${command.command_count} text commands · ${paintCount} paint bounds`;
        }
        return command.effects.map(effectSummary).join(" · ") || "no visible effect";
      }

      function createCommand(group) {
        const command = commandGroupView(group);
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "trace-command";
        button.setAttribute("aria-pressed", "false");
        bindCommandInteraction(button, group.index, false, true);

        const name = document.createElement("span");
        name.className = "trace-command-name";
        name.textContent = command.name;
        const range = document.createElement("span");
        range.className = "trace-command-range";
        range.textContent = `${command.byte_start}..${command.byte_end}`;
        const detail = document.createElement("span");
        detail.className = "trace-command-detail";
        detail.textContent = command.detail;
        const effects = document.createElement("span");
        effects.className = "trace-command-effects";
        effects.textContent = groupEffectSummary(command);
        button.append(name, range, detail, effects);
        item.append(button);
        if (command.annotation) {
          const annotation = document.createElement("span");
          annotation.className = "trace-command-annotation";
          const href = qrLink(command.annotation.content);
          const content = document.createElement(href ? "a" : "span");
          content.textContent = command.annotation.label;
          if (href) {
            content.href = href;
            content.target = "_blank";
            content.rel = "noopener noreferrer";
            content.addEventListener("click", (event) => {
              event.stopPropagation();
              void copyText(command.annotation.content);
            });
          }
          const copy = document.createElement("button");
          copy.type = "button";
          copy.className = "trace-command-copy";
          copy.textContent = "⧉";
          copy.title = "Copy QR content";
          copy.setAttribute("aria-label", "Copy QR content");
          copy.addEventListener("click", (event) => {
            event.stopPropagation();
            void copyText(command.annotation.content);
          });
          annotation.append(content, copy);
          item.append(annotation);
        }
        return item;
      }

      function showCommands(groups) {
        const entries = groups || [];
        pinnedCommand = null;
        previewedCommand = null;
        commandPanel.hidden = entries.length === 0;
        traceWorkspace.classList.toggle("trace-without-commands", entries.length === 0);
        commandList.replaceChildren(...entries.map(createCommand));
      }

      // Server-connection indicator: connected | error | offline. The dot colour
      // comes from the state class on #connection; this sets the state text.
      function setConnection(state, detail) {
        connection.className = state;
        connectionState.textContent = detail;
      }

      let flashTimer;

      function applyMargin() {
        // The class lives on the persistent container, so it also styles sheets
        // added by later renders without reapplying per sheet.
        sheets.classList.toggle("paper-margin", margin.checked);
      }

      function flashMargin() {
        // Remove and re-add so the animation restarts on repeated toggles.
        sheets.classList.remove("flash");
        void sheets.offsetWidth;
        sheets.classList.add("flash");
        window.clearTimeout(flashTimer);
        flashTimer = window.setTimeout(() => sheets.classList.remove("flash"), 650);
      }

      function showError(message) {
        error.textContent = message;
        error.style.display = "block";
      }

      function clearError() {
        error.textContent = "";
        error.style.display = "none";
      }

      let currentWarnings = "";

      // Non-fatal diagnostics for the current render. Rebuilt only when the set
      // changes, so the 0.75 s poll does not churn the DOM.
      function showWarnings(list) {
        const messages = list || [];
        const key = messages.join("\n");
        if (key === currentWarnings) {
          return;
        }
        currentWarnings = key;
        if (messages.length === 0) {
          warnings.replaceChildren();
          warnings.style.display = "none";
          return;
        }
        warnings.replaceChildren(
          ...messages.map((text) => {
            const line = document.createElement("div");
            line.className = "warning";
            line.textContent = text;
            return line;
          })
        );
        warnings.style.display = "block";
      }

      function showRendering(rendering, cacheKey) {
        // A render error (e.g. malformed ESC/POS) is distinct from the server
        // being unreachable, which refresh() reports separately.
        if (rendering.error) {
          showError(`Render error: ${rendering.error}`);
        } else {
          clearError();
        }

        // Reflect an in-progress capture every poll, independent of generation:
        // it replaces the job status while the last render and profile stay.
        printStatus.classList.toggle("receiving", rendering.receiving === true);

        // Anti-aliased renders are supersampled grayscale; smooth them instead
        // of the nearest-neighbour scaling used for the faithful dot grid.
        sheets.classList.toggle("antialiased", rendering.antialias === true);

        // Offer the current job's raw bytes for download, but not mid-capture.
        const canDownload =
          rendering.input_available === true && rendering.receiving !== true;
        download.style.display = canDownload ? "inline" : "none";
        // Vary by generation so a new job's bytes are not served from cache.
        download.href = `/job?g=${rendering.generation}`;

        // The status line and warnings update every poll: a render error or an
        // in-progress capture changes them without advancing the generation.
        updateStatus(rendering);
        showWarnings(rendering.warnings);

        // Rebuilding the sheet images is expensive, so gate it on a new job.
        // Errors leave the generation unchanged and keep the last sheets shown.
        const identity = String(rendering.generation);
        if (identity === currentRendering) {
          return;
        }
        currentRendering = identity;

        let nextGroupIndex = 0;
        const groupedSheets = rendering.sheets.map((sheet) => {
          const commandGroups = groupAdjacentCommands(sheet.commands, nextGroupIndex);
          nextGroupIndex += commandGroups.length;
          return { ...sheet, commandGroups };
        });
        showCommands(groupedSheets.flatMap((sheet) => sheet.commandGroups));

        const sheetElements = groupedSheets.map((sheet) => {
          const element = createSheet(
            sheet,
            rendering.sheets.length,
            cacheKey,
            sheet.commandGroups
          );
          return element;
        });
        sheets.replaceChildren(...sheetElements);
      }

      // The profile, waiting hint, and job status reflect the latest poll rather
      // than the latest generation, so a job that arrives and fails is reported
      // as a failure instead of leaving "Waiting for first job" on screen.
      function updateStatus(rendering) {
        // The profile is known from startup, so it always shows.
        profile.textContent = rendering.profile;

        // Nothing has rendered and nothing has failed yet: guide the developer.
        if (rendering.sheets.length === 0 && !rendering.error) {
          waiting.textContent = rendering.hint || "";
          waiting.style.display = rendering.hint ? "block" : "none";
          jobStatus.textContent = "Waiting for first job";
          completionLabel.textContent = "";
          return;
        }

        // A job arrived — it either rendered or failed. Either way we are no
        // longer waiting for the first job.
        waiting.style.display = "none";
        if (rendering.error) {
          // A received job that could not be rendered; the banner shows why.
          jobStatus.textContent = "Render failed";
          completionLabel.textContent = "";
        } else {
          // Always show a status: the time the job completed.
          jobStatus.textContent = completionTime(rendering.completed_at);
          // Flag a job ended by the idle timeout, since it may be incomplete.
          completionLabel.textContent =
            rendering.completion === "timeout" ? "idle-timeout" : "";
        }
      }

      function copyText(text) {
        const fallbackCopy = () => {
          const fallback = document.createElement("textarea");
          fallback.value = text;
          fallback.setAttribute("readonly", "");
          fallback.style.position = "fixed";
          fallback.style.opacity = "0";
          document.body.append(fallback);
          fallback.select();
          document.execCommand("copy");
          fallback.remove();
        };
        return navigator.clipboard?.writeText
          ? navigator.clipboard.writeText(text).catch(fallbackCopy)
          : Promise.resolve(fallbackCopy());
      }

      function qrLink(content) {
        if (!content.startsWith("http://") && !content.startsWith("https://")) {
          return null;
        }
        try {
          const url = new URL(content);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      }

      function activateQrLabel(event, annotation) {
        event.preventDefault();
        event.stopPropagation();
        void copyText(annotation.content);
        const href = qrLink(annotation.content);
        if (href) {
          window.open(href, "_blank", "noopener,noreferrer");
        }
      }

      function createTraceOverlay(sheet, commandGroups) {
        const namespace = "http://www.w3.org/2000/svg";
        const overlay = document.createElementNS(namespace, "svg");
        overlay.classList.add("trace-overlay");
        overlay.setAttribute("viewBox", `0 0 ${sheet.width_dots} ${sheet.height_dots}`);
        overlay.setAttribute("width", String(sheet.width_dots));
        overlay.setAttribute("height", String(sheet.height_dots));
        overlay.setAttribute("aria-label", `Trace regions for ${sheet.name}`);

        const definitions = document.createElementNS(namespace, "defs");
        const arrow = document.createElementNS(namespace, "marker");
        const arrowId = `trace-motion-arrow-${sheet.order}`;
        arrow.id = arrowId;
        arrow.setAttribute("viewBox", "0 0 8 8");
        arrow.setAttribute("refX", "7");
        arrow.setAttribute("refY", "4");
        arrow.setAttribute("markerWidth", "12");
        arrow.setAttribute("markerHeight", "12");
        arrow.setAttribute("orient", "auto");
        arrow.setAttribute("markerUnits", "userSpaceOnUse");
        const arrowShape = document.createElementNS(namespace, "path");
        arrowShape.setAttribute("d", "M 0 0 L 8 4 L 0 8 z");
        arrowShape.setAttribute("fill", "context-stroke");
        arrow.append(arrowShape);
        definitions.append(arrow);
        overlay.append(definitions);

        commandGroups.forEach((commandGroup, commandGroupIndex) => {
          const paintingCommands = commandGroup.commands
            .map((command) => ({
              command,
              paint: command.effects.find((effect) => effect.type === "paint"),
            }))
            .filter(({ paint }) => paint);
          const motions = commandGroup.commands.flatMap((command) =>
            command.effects.filter((effect) => effect.type === "motion")
          );
          if (paintingCommands.length === 0 && motions.length === 0) {
            return;
          }
          const command = commandGroupView(commandGroup);
          const group = document.createElementNS(namespace, "g");
          group.classList.add("trace-region-group");
          group.setAttribute("tabindex", "0");
          group.setAttribute("role", "button");
          group.setAttribute("aria-label", `Highlight ${command.name} group at bytes ${command.byte_start} to ${command.byte_end}`);
          bindCommandInteraction(group, commandGroup.index, true);
          group.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              activateCommand(commandGroup.index, true);
            }
          });
          paintingCommands.forEach(({ paint }) => {
            const rectangle = document.createElementNS(namespace, "rect");
            rectangle.classList.add("trace-region");
            rectangle.setAttribute("x", String(paint.bounds.x));
            rectangle.setAttribute("y", String(paint.bounds.y));
            rectangle.setAttribute("width", String(paint.bounds.width));
            rectangle.setAttribute("height", String(paint.bounds.height));
            group.append(rectangle);
            if (command.annotation) {
              const contentWidth = Math.max(24, command.annotation.label.length * 6 + 10);
              const labelWidth = contentWidth + 18;
              const labelX = paint.bounds.x + paint.bounds.width / 2;
              const labelY = paint.bounds.y + paint.bounds.height;
              const label = document.createElementNS(namespace, "g");
              label.classList.add("trace-paint-label");
              label.setAttribute("tabindex", "0");
              const href = qrLink(command.annotation.content);
              label.setAttribute("role", href ? "link" : "button");
              label.setAttribute(
                "aria-label",
                href
                  ? `Copy and open QR content: ${command.annotation.label}`
                  : `Copy QR content: ${command.annotation.label}`
              );
              const labelTitle = document.createElementNS(namespace, "title");
              labelTitle.textContent = href
                ? "Open in browser and copy QR content"
                : "Copy QR content";
              label.addEventListener("focus", () =>
                previewCommand(commandGroup.index, true)
              );
              label.addEventListener("blur", () => previewCommand(null));
              label.addEventListener(
                "click",
                (event) => activateQrLabel(event, command.annotation)
              );
              label.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                  activateQrLabel(event, command.annotation);
                }
              });
              const labelBackground = document.createElementNS(namespace, "rect");
              labelBackground.setAttribute("x", String(labelX - labelWidth / 2));
              labelBackground.setAttribute("y", String(labelY - 7));
              labelBackground.setAttribute("width", String(labelWidth));
              labelBackground.setAttribute("height", "14");
              labelBackground.setAttribute("rx", "2");
              const labelText = document.createElementNS(namespace, "text");
              labelText.setAttribute("x", String(labelX - 9));
              labelText.setAttribute("y", String(labelY + 4));
              labelText.textContent = command.annotation.label;
              const action = document.createElementNS(namespace, "text");
              action.classList.add("trace-paint-action");
              action.setAttribute("x", String(labelX + contentWidth / 2));
              action.setAttribute("y", String(labelY + 4));
              action.textContent = href ? "↗" : "⧉";
              label.append(labelTitle, labelBackground, labelText, action);
              group.append(label);
            }
          });
          motions.forEach((motion) => {
            const terminals = motionTerminals(commandGroups, commandGroupIndex, motion);
            const middleY = (terminals.sourceBottom + motion.after.y) / 2;
            const pathData =
              `M ${terminals.sourceX} ${terminals.sourceBottom} ` +
              `V ${middleY} H ${motion.after.x} V ${motion.after.y}`;
            const terminalData =
              `M ${terminals.sourceX} ${terminals.sourceTop} ` +
              `V ${terminals.sourceBottom} ` +
              `M ${motion.after.x} ${motion.after.y} ` +
              `V ${terminals.targetBottom}`;
            const hitPath = document.createElementNS(namespace, "path");
            hitPath.classList.add("trace-motion-hit");
            hitPath.setAttribute("d", `${pathData} ${terminalData}`);
            const path = document.createElementNS(namespace, "path");
            path.classList.add("trace-motion-visual");
            path.setAttribute("d", pathData);
            const terminalsPath = document.createElementNS(namespace, "path");
            terminalsPath.classList.add("trace-motion-visual");
            terminalsPath.setAttribute("d", terminalData);
            terminalsPath.setAttribute("marker-end", `url(#${arrowId})`);
            const labelX = (motion.before.x + motion.after.x) / 2;
            const label = document.createElementNS(namespace, "g");
            label.classList.add("trace-motion-label");
            const labelBackground = document.createElementNS(namespace, "rect");
            labelBackground.setAttribute("x", String(labelX - 10));
            labelBackground.setAttribute("y", String(middleY - 7));
            labelBackground.setAttribute("width", "20");
            labelBackground.setAttribute("height", "14");
            labelBackground.setAttribute("rx", "2");
            const labelText = document.createElementNS(namespace, "text");
            labelText.setAttribute("x", String(labelX));
            labelText.setAttribute("y", String(middleY + 4));
            labelText.textContent = "LF";
            label.append(labelBackground, labelText);
            group.append(hitPath, terminalsPath, path, label);
          });
          overlay.append(group);
        });
        return overlay;
      }

      function createSheet(sheet, sheetCount, cacheKey, commandGroups) {
        const figure = document.createElement("figure");
        figure.className = "sheet";

        const caption = document.createElement("figcaption");
        const name = document.createElement("span");
        name.className = "sheet-name";
        name.textContent = sheet.name;
        const dimensions = document.createElement("span");
        dimensions.className = "sheet-dimensions";
        dimensions.textContent =
          `Sheet ${sheet.order} of ${sheetCount} · ` +
          `${sheet.width_dots} × ${sheet.height_dots} printer dots`;
        caption.append(name, dimensions);

        const image = document.createElement("img");
        image.className = "receipt";
        image.alt = `Rendered receipt sheet ${sheet.order} of ${sheetCount}`;
        // Lay the sheet out at one CSS pixel per printer dot, independent of the
        // render's supersample factor, so --scale stays a resolution knob rather
        // than a size knob. Browser zoom magnifies from here.
        image.style.width = `${sheet.width_dots}px`;
        image.src = `${sheet.url}?t=${cacheKey}`;
        const layer = document.createElement("div");
        layer.className = "receipt-layer";
        layer.append(image, createTraceOverlay(sheet, commandGroups));
        figure.append(caption, layer);
        return figure;
      }

      async function refresh() {
        const cacheKey = Date.now();
        try {
          const response = await fetch("/api/render", { cache: "no-store" });
          if (!response.ok) {
            setConnection("error", `Server error (HTTP ${response.status})`);
            return;
          }
          setConnection("connected", "Connected");
          showRendering(await response.json(), cacheKey);
        } catch {
          // fetch throws when the server is unreachable — stopped, restarted, or
          // the connection dropped. The 0.75 s poll keeps trying, so recovery is
          // automatic once it is back. The last render stays on screen.
          setConnection("offline", "Offline, reconnecting…");
        }
      }

      const MARGIN_KEY = "escpost.paper_margin";

      function readSetting(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeSetting(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // Ignore storage failures; the setting just will not persist.
        }
      }

      // Restore saved settings. The margin is on unless it was turned off.
      const storedMargin = readSetting(MARGIN_KEY);
      margin.checked = storedMargin === null ? true : storedMargin === "true";

      margin.addEventListener("change", () => {
        writeSetting(MARGIN_KEY, String(margin.checked));
        applyMargin();
        if (margin.checked) {
          flashMargin();
        }
      });
      applyMargin();
      setConnection("", "Connecting…");
      refresh();
      window.setInterval(refresh, 750);
    </script>
  </body>
</html>
