<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESCPost render</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #171717;
        color: #f5f5f5;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      /* Title on the left, server status centred on the first line. */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
      }

      .bar h1 {
        justify-self: start;
      }

      #serverStatus {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #b8b8b8;
        font-size: 13px;
      }

      /* The profile is what we render as; it sits in the server headline
         between the address and the connection state. */
      #profile:empty {
        display: none;
      }

      #profile:not(:empty)::before,
      #connectionState::before {
        content: "·";
        margin-right: 8px;
        color: #6b6b6b;
      }

      /* Print-status header inside the sheets box: everything about the latest
         print (completion time, idle-timeout, receiving). Its first field
         varies, so it is spaced with a gap rather than leading separators. */
      #printStatus {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        color: #b8b8b8;
        font-size: 13px;
      }

      /* The job status: "Waiting for first job" or the completion time. */
      #jobStatus:empty {
        display: none;
      }

      /* A caution shown when a job was completed by the idle timeout rather
         than an explicit connection close, so it may be incomplete. */
      #completion:empty {
        display: none;
      }

      #completion {
        color: #ffb454;
      }

      /* Download the current job's exact captured bytes. JS controls display. */
      #download {
        display: none;
        color: #7fd1ff;
        text-decoration: none;
      }

      #download:hover {
        text-decoration: underline;
      }

      /* While a job is still arriving, this replaces the job status and
         completion and pulses to signal ongoing activity. The last render and
         the profile stay visible. */
      #receiving {
        display: none;
        align-items: center;
        color: #7fd1ff;
        animation: receiving-pulse 1.2s ease-in-out infinite;
      }

      #printStatus.receiving #jobStatus,
      #printStatus.receiving #completion {
        display: none;
      }

      #printStatus.receiving #receiving {
        display: inline-flex;
      }

      @keyframes receiving-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      #connection {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #connection::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b6b6b;
      }

      #connection.connected::before {
        background: #57c964;
      }

      #connection.offline::before {
        background: #ff6b6b;
      }

      #connection.error::before {
        background: #ffb454;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      label,
      #status,
      .sheet-dimensions {
        color: #b8b8b8;
        font-size: 13px;
      }

      /* Paper-margin toggle pinned to the bottom-right corner of the viewport. */
      #viewOptions {
        position: absolute;
        right: 24px;
        bottom: 24px;
      }

      #viewOptions label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      #viewOptions input {
        margin: 0;
      }

      select {
        padding: 4px 8px;
        font: inherit;
      }

      #viewport {
        position: relative;
        overflow: auto;
        min-height: 160px;
        padding: 24px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #252525;
      }

      #sheets {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        /* Centre each row and wrap to the next line when a row runs out of
           horizontal space. "safe" falls back to start-alignment when a sheet
           is wider than the viewport (e.g. at high zoom) so its left edge stays
           scrollable rather than being clipped. */
        justify-content: safe center;
        gap: 24px;
      }

      .sheet {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
      }

      .sheet figcaption {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sheet-name {
        color: #f5f5f5;
        font-size: 13px;
        font-weight: 700;
      }

      .receipt {
        display: block;
        max-width: none;
        /* Reserve blank paper on top/left/right at all times so toggling the
           margin only changes its colour and shadow and never shifts the
           receipt. The bottom is left flush because receipt paper feeds
           continuously. */
        padding: 16px 16px 0;
        background-color: transparent;
        /* Faithful 1-bit dots stay crisp under nearest-neighbour scaling. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transition:
          background-color 150ms ease,
          box-shadow 150ms ease;
      }

      /* An anti-aliased preview is a supersampled grayscale image, so let the
         browser smooth it: nearest-neighbour would discard the very softening
         it encodes whenever the image is scaled into its box. */
      #sheets.antialiased .receipt {
        image-rendering: auto;
      }

      /* The reserved padding reads as unprinted receipt paper when enabled, and
         the sheet gains a drop shadow so it looks like a physical sheet. With
         the margin off there is no paper frame, so no shadow either. */
      #sheets.paper-margin .receipt {
        background-color: white;
        box-shadow: 0 3px 16px rgb(0 0 0 / 45%);
      }

      /* Briefly tint the margin on enable so its extent is visible. */
      @keyframes reveal-margin {
        from {
          background-color: #7fd1ff;
        }
        to {
          background-color: white;
        }
      }

      #sheets.paper-margin.flash .receipt {
        animation: reveal-margin 600ms ease-out;
      }

      #waiting {
        display: none;
        margin: 0;
        color: #b8b8b8;
      }

      #error {
        display: none;
        color: #ff9d9d;
      }

      /* Non-fatal render diagnostics (e.g. a cut dropped on a cutter-less
         profile). Amber to set them apart from the red render-error banner. */
      #warnings {
        display: none;
        margin: 16px 0 0;
        color: #ffb454;
        font-size: 13px;
      }

      #warnings .warning {
        display: flex;
        gap: 6px;
      }

      #warnings .warning::before {
        content: "⚠";
      }

      /* Footer note under the sheets; only meaningful once something is
         rendered, so it is hidden while the sheet list is empty. */
      #magnifyHint {
        margin: 16px 0 0;
        color: #6b6b6b;
        font-size: 13px;
      }

      #sheets:empty ~ #magnifyHint {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>ESCPost render</h1>
        <div id="serverStatus">
          <span id="connection">
            <span id="serverAddress"></span>
            <span id="profile"></span>
            <span id="connectionState">Connecting…</span>
          </span>
        </div>
      </div>
    </header>

    <main id="viewport">
      <div id="printStatus">
        <span id="jobStatus"></span>
        <span id="completion"></span>
        <a id="download" href="/job" download>Download raw input</a>
        <span id="receiving">Receiving a job…</span>
      </div>
      <div id="sheets" aria-live="polite"></div>
      <div id="viewOptions">
        <label>
          <input type="checkbox" id="margin">
          Paper margin
        </label>
      </div>
      <div id="warnings" aria-live="polite"></div>
      <p id="magnifyHint">Use your browser's zoom to magnify.</p>
      <p id="waiting" aria-live="polite"></p>
      <p id="error"></p>
    </main>

    <script>
      const sheets = document.querySelector("#sheets");
      const waiting = document.querySelector("#waiting");
      const error = document.querySelector("#error");
      const warnings = document.querySelector("#warnings");
      const margin = document.querySelector("#margin");
      const profile = document.querySelector("#profile");
      const jobStatus = document.querySelector("#jobStatus");
      const completionLabel = document.querySelector("#completion");
      const download = document.querySelector("#download");
      const connection = document.querySelector("#connection");
      const connectionState = document.querySelector("#connectionState");
      const printStatus = document.querySelector("#printStatus");

      function completionTime(millis) {
        return typeof millis === "number"
          ? new Date(millis).toLocaleTimeString()
          : "";
      }

      // The address the viewer is talking to never changes for this page.
      document.querySelector("#serverAddress").textContent = window.location.host;
      let currentRendering = "";

      // Server-connection indicator: connected | error | offline. The dot colour
      // comes from the state class on #connection; this sets the state text.
      function setConnection(state, detail) {
        connection.className = state;
        connectionState.textContent = detail;
      }

      let flashTimer;

      function applyMargin() {
        // The class lives on the persistent container, so it also styles sheets
        // added by later renders without reapplying per sheet.
        sheets.classList.toggle("paper-margin", margin.checked);
      }

      function flashMargin() {
        // Remove and re-add so the animation restarts on repeated toggles.
        sheets.classList.remove("flash");
        void sheets.offsetWidth;
        sheets.classList.add("flash");
        window.clearTimeout(flashTimer);
        flashTimer = window.setTimeout(() => sheets.classList.remove("flash"), 650);
      }

      function showError(message) {
        error.textContent = message;
        error.style.display = "block";
      }

      function clearError() {
        error.textContent = "";
        error.style.display = "none";
      }

      let currentWarnings = "";

      // Non-fatal diagnostics for the current render. Rebuilt only when the set
      // changes, so the 0.75 s poll does not churn the DOM.
      function showWarnings(list) {
        const messages = list || [];
        const key = messages.join("\n");
        if (key === currentWarnings) {
          return;
        }
        currentWarnings = key;
        if (messages.length === 0) {
          warnings.replaceChildren();
          warnings.style.display = "none";
          return;
        }
        warnings.replaceChildren(
          ...messages.map((text) => {
            const line = document.createElement("div");
            line.className = "warning";
            line.textContent = text;
            return line;
          })
        );
        warnings.style.display = "block";
      }

      function showRendering(rendering, cacheKey) {
        // A render error (e.g. malformed ESC/POS) is distinct from the server
        // being unreachable, which refresh() reports separately.
        if (rendering.error) {
          showError(`Render error: ${rendering.error}`);
        } else {
          clearError();
        }

        // Reflect an in-progress capture every poll, independent of generation:
        // it replaces the job status while the last render and profile stay.
        printStatus.classList.toggle("receiving", rendering.receiving === true);

        // Anti-aliased renders are supersampled grayscale; smooth them instead
        // of the nearest-neighbour scaling used for the faithful dot grid.
        sheets.classList.toggle("antialiased", rendering.antialias === true);

        // Offer the current job's raw bytes for download, but not mid-capture.
        const canDownload =
          rendering.input_available === true && rendering.receiving !== true;
        download.style.display = canDownload ? "inline" : "none";
        // Vary by generation so a new job's bytes are not served from cache.
        download.href = `/job?g=${rendering.generation}`;

        // The status line and warnings update every poll: a render error or an
        // in-progress capture changes them without advancing the generation.
        updateStatus(rendering);
        showWarnings(rendering.warnings);

        // Rebuilding the sheet images is expensive, so gate it on a new job.
        // Errors leave the generation unchanged and keep the last sheets shown.
        const identity = String(rendering.generation);
        if (identity === currentRendering) {
          return;
        }
        currentRendering = identity;

        sheets.replaceChildren(
          ...rendering.sheets.map((sheet) =>
            createSheet(sheet, rendering.sheets.length, cacheKey)
          )
        );
      }

      // The profile, waiting hint, and job status reflect the latest poll rather
      // than the latest generation, so a job that arrives and fails is reported
      // as a failure instead of leaving "Waiting for first job" on screen.
      function updateStatus(rendering) {
        // The profile is known from startup, so it always shows.
        profile.textContent = rendering.profile;

        // Nothing has rendered and nothing has failed yet: guide the developer.
        if (rendering.sheets.length === 0 && !rendering.error) {
          waiting.textContent = rendering.hint || "";
          waiting.style.display = rendering.hint ? "block" : "none";
          jobStatus.textContent = "Waiting for first job";
          completionLabel.textContent = "";
          return;
        }

        // A job arrived — it either rendered or failed. Either way we are no
        // longer waiting for the first job.
        waiting.style.display = "none";
        if (rendering.error) {
          // A received job that could not be rendered; the banner shows why.
          jobStatus.textContent = "Render failed";
          completionLabel.textContent = "";
        } else {
          // Always show a status: the time the job completed.
          jobStatus.textContent = completionTime(rendering.completed_at);
          // Flag a job ended by the idle timeout, since it may be incomplete.
          completionLabel.textContent =
            rendering.completion === "timeout" ? "idle-timeout" : "";
        }
      }

      function createSheet(sheet, sheetCount, cacheKey) {
        const figure = document.createElement("figure");
        figure.className = "sheet";

        const caption = document.createElement("figcaption");
        const name = document.createElement("span");
        name.className = "sheet-name";
        name.textContent = sheet.name;
        const dimensions = document.createElement("span");
        dimensions.className = "sheet-dimensions";
        dimensions.textContent =
          `Sheet ${sheet.order} of ${sheetCount} · ` +
          `${sheet.width_dots} × ${sheet.height_dots} printer dots`;
        caption.append(name, dimensions);

        const image = document.createElement("img");
        image.className = "receipt";
        image.alt = `Rendered receipt sheet ${sheet.order} of ${sheetCount}`;
        // Lay the sheet out at one CSS pixel per printer dot, independent of the
        // render's supersample factor, so --scale stays a resolution knob rather
        // than a size knob. Browser zoom magnifies from here.
        image.style.width = `${sheet.width_dots}px`;
        image.src = `${sheet.url}?t=${cacheKey}`;
        figure.append(caption, image);
        return figure;
      }

      async function refresh() {
        const cacheKey = Date.now();
        try {
          const response = await fetch("/api/render", { cache: "no-store" });
          if (!response.ok) {
            setConnection("error", `Server error (HTTP ${response.status})`);
            return;
          }
          setConnection("connected", "Connected");
          showRendering(await response.json(), cacheKey);
        } catch {
          // fetch throws when the server is unreachable — stopped, restarted, or
          // the connection dropped. The 0.75 s poll keeps trying, so recovery is
          // automatic once it is back. The last render stays on screen.
          setConnection("offline", "Offline, reconnecting…");
        }
      }

      const MARGIN_KEY = "escpost.paper_margin";

      function readSetting(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeSetting(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // Ignore storage failures; the setting just will not persist.
        }
      }

      // Restore saved settings. The margin is on unless it was turned off.
      const storedMargin = readSetting(MARGIN_KEY);
      margin.checked = storedMargin === null ? true : storedMargin === "true";

      margin.addEventListener("change", () => {
        writeSetting(MARGIN_KEY, String(margin.checked));
        applyMargin();
        if (margin.checked) {
          flashMargin();
        }
      });
      applyMargin();
      setConnection("", "Connecting…");
      refresh();
      window.setInterval(refresh, 750);
    </script>
  </body>
</html>
