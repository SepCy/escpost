<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESCPost render</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #171717;
        color: #f5f5f5;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      label,
      #status,
      .sheet-dimensions {
        color: #b8b8b8;
        font-size: 13px;
      }

      select {
        margin-left: 6px;
        padding: 4px 8px;
        font: inherit;
      }

      #viewport {
        overflow: auto;
        min-height: 160px;
        padding: 24px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #252525;
      }

      #sheets {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }

      .sheet {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
      }

      .sheet figcaption {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sheet-name {
        color: #f5f5f5;
        font-size: 13px;
        font-weight: 700;
      }

      .receipt {
        display: block;
        max-width: none;
        background: white;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 3px 16px rgb(0 0 0 / 45%);
      }

      #waiting {
        display: none;
        margin: 0;
        color: #b8b8b8;
      }

      #error {
        display: none;
        color: #ff9d9d;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ESCPost render</h1>
      <label>
        Zoom
        <select id="zoom">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
      <span id="status"></span>
    </header>

    <main id="viewport">
      <div id="sheets" aria-live="polite"></div>
      <p id="waiting" aria-live="polite"></p>
      <p id="error">The rendering is currently unavailable.</p>
    </main>

    <script>
      const sheets = document.querySelector("#sheets");
      const waiting = document.querySelector("#waiting");
      const error = document.querySelector("#error");
      const zoom = document.querySelector("#zoom");
      const status = document.querySelector("#status");
      let currentRendering = "";

      function applyZoom() {
        for (const image of sheets.querySelectorAll(".receipt")) {
          image.style.width =
            `${Number(image.dataset.widthDots) * Number(zoom.value)}px`;
        }
      }

      function showRendering(rendering, cacheKey) {
        if (rendering.error) {
          error.textContent = rendering.error;
          error.style.display = "block";
        } else {
          error.style.display = "none";
        }

        const identity = String(rendering.generation);
        if (identity === currentRendering) {
          return;
        }
        currentRendering = identity;

        // No job captured yet: guide the developer instead of showing sheets.
        if (rendering.sheets.length === 0 && rendering.hint) {
          sheets.replaceChildren();
          waiting.textContent = rendering.hint;
          waiting.style.display = "block";
          status.textContent = "Waiting";
          return;
        }
        waiting.style.display = "none";

        sheets.replaceChildren(
          ...rendering.sheets.map((sheet) =>
            createSheet(sheet, rendering.sheets.length, cacheKey)
          )
        );
        status.textContent =
          `${rendering.profile} · ${rendering.sheets.length} ` +
          `${rendering.sheets.length === 1 ? "sheet" : "sheets"}`;
      }

      function createSheet(sheet, sheetCount, cacheKey) {
        const figure = document.createElement("figure");
        figure.className = "sheet";

        const caption = document.createElement("figcaption");
        const name = document.createElement("span");
        name.className = "sheet-name";
        name.textContent = sheet.name;
        const dimensions = document.createElement("span");
        dimensions.className = "sheet-dimensions";
        dimensions.textContent =
          `Sheet ${sheet.order} of ${sheetCount} · ` +
          `${sheet.width_dots} × ${sheet.height_dots} printer dots`;
        caption.append(name, dimensions);

        const image = document.createElement("img");
        image.className = "receipt";
        image.alt = `Rendered receipt sheet ${sheet.order} of ${sheetCount}`;
        image.dataset.widthDots = sheet.width_dots;
        image.src = `${sheet.url}?t=${cacheKey}`;
        figure.append(caption, image);
        return figure;
      }

      async function refresh() {
        const cacheKey = Date.now();
        try {
          const response = await fetch("/api/render", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`render request returned ${response.status}`);
          }
          showRendering(await response.json(), cacheKey);
          applyZoom();
        } catch {
          status.textContent = "";
          error.style.display = "block";
        }
      }

      zoom.addEventListener("change", applyZoom);
      refresh();
      window.setInterval(refresh, 750);
    </script>
  </body>
</html>
