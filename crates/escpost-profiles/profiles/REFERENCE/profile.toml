schema_version = 1
profile = "REFERENCE"
vendor = "ESCPost"
model = "Reference"
paper_width_mm = 80.0

sources = [
    "manual:epson-escpos",
    "case:tests/cases/mechanism/reference-full-and-partial-cuts",
]

[source]
type = "reference"

[geometry]
# A virtual 80 mm, 203 DPI mechanism gives previews a concrete dot grid.
printable_width_dots = 576
dpi_x = 203
dpi_y = 203

[cutter]
# ESC/POS does not standardize mechanism geometry. This explicit virtual
# distance makes Function B feed-to-cutter behavior deterministic.
print_head_to_cutter_dots = 80

[motion]
horizontal_units_per_inch = 203
vertical_units_per_inch = 203

[column_bit_image]
# Epson's 8-dot modes use a 203/3 DPI vertical density at 203 printer DPI.
eight_dot_vertical_pitch_dots = 3

[commands]
esc_backslash_negative = "apply"
esc_dollar_after_printable_data = "apply"
esc_j = "feed"
gs_v_0_following_lf = "feed"
gs_v_function_b_full = "feed"
gs_v_function_b_partial = "feed"

[defaults]
line_spacing_dots = 30
code_page = 0
international_character_set = 0
carriage_return = "ignored"

[fonts.a]
cell_width_dots = 12
cell_height_dots = 24
baseline_dots = 20

[fonts.b]
cell_width_dots = 9
cell_height_dots = 17
baseline_dots = 14

[features]
bit_image_column = true
bit_image_raster = true
graphics = true
paper_full_cut = true
paper_part_cut = true
pulse_standard = true
qr_code = true

[features.barcodes]
function_a = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
]
function_b = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
    "code_93",
    "code_128",
    "gs1_128",
    "gs1_databar_omnidirectional",
    "gs1_databar_truncated",
    "gs1_databar_limited",
    "gs1_databar_expanded",
    "code_128_auto",
]

[code_pages]
