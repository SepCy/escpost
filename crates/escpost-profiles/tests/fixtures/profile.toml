schema_version = 1
profile = "TEST-THERMAL-80"
sources = ["fixture:capabilities.json"]

[source]
type = "upstream"

[geometry]
printable_width_dots = 512
dpi_x = 180
dpi_y = 180

[motion]
horizontal_units_per_inch = 180
vertical_units_per_inch = 180

[column_bit_image]
eight_dot_vertical_pitch_dots = 1

[commands]
esc_backslash_negative = "ignored"
esc_dollar_after_printable_data = "ignored"
esc_j = "ignored"
gs_v_0_following_lf = "ignored"
gs_v_function_b_full = "feed"
gs_v_function_b_partial = "ignored"

[defaults]
line_spacing_dots = 30
code_page = 0
international_character_set = 0
carriage_return = "ignored"

[fonts.a]
cell_width_dots = 12
cell_height_dots = 24
baseline_dots = 20

[fonts.b]
cell_width_dots = 9
cell_height_dots = 17
baseline_dots = 14

[features]
qr_code = true

[features.barcodes]
function_a = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
]
function_b = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
    "code_93",
    "code_128",
]
