# Copy this file to ESCPost's user configuration as printers.toml, or to
# local/config/printers.toml when using the development wrapper.

[netum-usb]
transport = "usb"
profile = "NT-5890K"
vendor_id = "0x0000"
product_id = "0x0000"
# serial_number = "uncomment-if-the-printer-exposes-one"
interface_number = 0
out_endpoint = "0x01"
in_endpoint = "0x81"
