schema_version = 1
profile = "NT-5890K"

sources = [
    "upstream:escpos-printer-db/NT-5890K",
    "manual:epson-escpos/esc_3#default-line-spacing",
    "manual:epson-escpos/cr#print-and-carriage-return",
    "manual:epson-escpos/esc_r#select-international-character-set",
    "manual:epson-escpos/esc_t#select-character-code-table",
    "case:tests/cases/graphics/esc-star-8dot-double-density",
    "case:tests/cases/graphics/gs-v0-all-scaling-modes",
    "case:tests/cases/motion/gs-v-function-b-feed",
    "case:tests/cases/motion/line-spacing-and-feed",
    "case:tests/cases/motion/positioning-and-print-area",
    "case:tests/cases/symbols/native-symbols-nt-5890k",
]

[source]
type = "upstream"
profile_sha256 = "2e471a3f255d2dc85988d350754023a107a882d33504dd2df5e9f3c8d4d79b0b"

[geometry]
printable_width_dots = 384
dpi_x = 203
dpi_y = 203

[motion]
horizontal_units_per_inch = 203
vertical_units_per_inch = 203

[column_bit_image]
# The connected printer maps the eight source bits to eight adjacent rows.
# Epson's 203/3-DPI baseline instead uses a three-printer-dot vertical pitch.
eight_dot_vertical_pitch_dots = 1

[commands]
# This firmware consumes negative ESC \ values without moving the cursor.
esc_backslash_negative = "ignored"
# It also consumes ESC $ without moving after printable data is buffered.
esc_dollar_after_printable_data = "ignored"
# Physical probes show that it also consumes ESC J and GS V 66 n without
# feeding. GS V 65 n performs the requested feed.
esc_j = "ignored"
# After GS v 0, exactly one immediately following LF is consumed without feed.
gs_v_0_following_lf = "ignored"
gs_v_function_b_full = "feed"
gs_v_function_b_partial = "ignored"

[defaults]
line_spacing_dots = 30
code_page = 0
international_character_set = 0
# Most horizontal thermal printers ignore CR while auto line feed is disabled;
# the NT-5890K is modeled to ignore it.
carriage_return = "ignored"

[fonts.a]
cell_width_dots = 12
cell_height_dots = 24
baseline_dots = 20

[fonts.b]
cell_width_dots = 9
cell_height_dots = 17
baseline_dots = 14

[features]
# The upstream NT-5890K inherits conservative `simple` flags. The exact probe
# referenced above physically printed both GS k forms and a Model 2 QR symbol.
qr_code = true

[features.barcodes]
# Newer Function B systems stay absent until they are physically verified.
function_a = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
]
function_b = [
    "upc_a",
    "upc_e",
    "ean_13",
    "ean_8",
    "code_39",
    "itf",
    "codabar",
    "code_93",
    "code_128",
]
