[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "escpost"
version = "0.1.0"
description = "Dot-accurate ESC/POS receipt renderer with a Python binding"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
# The package is a thin render binding over the Rust engine and needs no runtime
# dependencies. The developer CLI is a separate Rust executable.
dependencies = []

[tool.maturin]
manifest-path = "crates/escpost-python/Cargo.toml"
python-source = "python"
module-name = "escpost._native"
include = [
    { path = "calibration/*", format = "sdist" },
    { path = "profiles/*/profile.toml", format = "sdist" },
    { path = "profiles/*/expected-*.png", format = "sdist" },
    { path = "profiles/*/verification.toml", format = "sdist" },
    { path = "profiles/*/notes.md", format = "sdist" },
    { path = "profiles/*/TODO.md", format = "sdist" },
    { path = "profiles/.generated/profiles.json", format = "sdist" },
    { path = "profiles/.escpos-printer-db/LICENSE.md", format = "sdist" },
    { path = "profiles/.escpos-printer-db/LICENSE.md", format = "wheel" },
]
