<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>escpos2png calibration preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #171717;
        color: #f5f5f5;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      label,
      #status,
      .sheet-dimensions {
        color: #b8b8b8;
        font-size: 13px;
      }

      select {
        margin-left: 6px;
        padding: 4px 8px;
        font: inherit;
      }

      #viewport {
        overflow: auto;
        min-height: 160px;
        padding: 24px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #252525;
      }

      #sheets {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }

      .sheet {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
      }

      .sheet figcaption {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sheet-name {
        color: #f5f5f5;
        font-size: 13px;
        font-weight: 700;
      }

      .receipt {
        display: block;
        max-width: none;
        background: white;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 3px 16px rgb(0 0 0 / 45%);
      }

      #error {
        display: none;
        color: #ff9d9d;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Latest escpos2png calibration render</h1>
      <label>
        Zoom
        <select id="zoom">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
      <span id="status"></span>
    </header>

    <main id="viewport">
      <div id="sheets" aria-live="polite"></div>
      <p id="error">
        No preview is available yet. Render a case or calibration to
        <code>local/preview</code>.
      </p>
    </main>

    <script>
      const sheets = document.querySelector("#sheets");
      const error = document.querySelector("#error");
      const zoom = document.querySelector("#zoom");
      const status = document.querySelector("#status");
      let currentSheetNames = [];

      function applyZoom() {
        for (const image of sheets.querySelectorAll(".receipt")) {
          const naturalWidth = Number(image.dataset.naturalWidth);
          if (naturalWidth) {
            image.style.width = `${naturalWidth * Number(zoom.value)}px`;
          }
        }
      }

      function showSheets(sheetNames, cacheKey) {
        if (sheetNames.join("\n") !== currentSheetNames.join("\n")) {
          currentSheetNames = sheetNames;
          sheets.replaceChildren(
            ...sheetNames.map((sheetName, index) =>
              createSheet(sheetName, index, sheetNames.length)
            )
          );
        }

        for (const image of sheets.querySelectorAll(".receipt")) {
          image.src =
            `/local/preview/${encodeURIComponent(image.dataset.sheetName)}` +
            `?t=${cacheKey}`;
        }
        status.textContent =
          `${sheetNames.length} ${sheetNames.length === 1 ? "sheet" : "sheets"}`;
        error.style.display = "none";
      }

      function createSheet(sheetName, index, sheetCount) {
        const figure = document.createElement("figure");
        figure.className = "sheet";

        const caption = document.createElement("figcaption");
        const name = document.createElement("span");
        name.className = "sheet-name";
        name.textContent = sheetName;
        const dimensions = document.createElement("span");
        dimensions.className = "sheet-dimensions";
        dimensions.textContent = `Sheet ${index + 1} of ${sheetCount}`;
        caption.append(name, dimensions);

        const image = document.createElement("img");
        image.className = "receipt";
        image.alt = `Rendered receipt sheet ${index + 1} of ${sheetCount}`;
        image.dataset.sheetName = sheetName;
        image.addEventListener("load", () => {
          image.dataset.naturalWidth = image.naturalWidth;
          dimensions.textContent =
            `Sheet ${index + 1} of ${sheetCount} · ` +
            `${image.naturalWidth} × ${image.naturalHeight} printer dots`;
          applyZoom();
        });
        image.addEventListener("error", () => {
          image.dataset.naturalWidth = "";
          dimensions.textContent =
            `Sheet ${index + 1} of ${sheetCount} · image unavailable`;
        });

        figure.append(caption, image);
        return figure;
      }

      async function refresh() {
        const cacheKey = Date.now();
        try {
          const response = await fetch(
            `/local/preview/manifest.json?t=${cacheKey}`,
            { cache: "no-store" }
          );
          if (!response.ok) {
            throw new Error(`manifest request returned ${response.status}`);
          }
          const manifest = await response.json();
          if (
            !Array.isArray(manifest.sheets) ||
            manifest.sheets.length === 0 ||
            !manifest.sheets.every(
              (sheetName) =>
                typeof sheetName === "string" &&
                /^actual-\d{3}\.png$/.test(sheetName)
            )
          ) {
            throw new Error("manifest has no valid sheets");
          }
          showSheets(manifest.sheets, cacheKey);
        } catch {
          currentSheetNames = [];
          sheets.replaceChildren();
          status.textContent = "";
          error.style.display = "block";
        }
      }

      zoom.addEventListener("change", applyZoom);
      refresh();
      window.setInterval(refresh, 1500);
    </script>
  </body>
</html>
